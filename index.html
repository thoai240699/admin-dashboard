<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Search engines ignore -->
    <meta name="robots" content="noindex, nofollow" />
    <meta
      name="description"
      content="Admin Dashboard - Manage users, orders, roles, and permissions"
    />
    <title>Admin Dashboard</title>
    <!-- CSS -->
    <link rel="stylesheet" href="./assets/css/reset.css" />
    <link rel="stylesheet" href="./assets/css/styles.css" />
    <!-- Font awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <!-- Login modal -->
    <div class="modal active" id="loginModal">
      <div class="modal-content">
        <div class="login-header">
          <i class="fas fa-shield-alt"></i>
          <h2>Admin Login</h2>
        </div>
        <!-- id="loginForm" handler trong Auth.js -->
        <form id="loginForm" autocomplete="on" novalidate>
          <div class="form-group">
            <label for="username">
              <i class="fa-solid fa-user"></i> Username
            </label>
            <input
              type="text"
              id="username"
              name="username"
              required
              autocomplete="username"
              placeholder="Username123"
              autofocus
            />
          </div>
          <div class="form-group">
            <label for="password"
              ><i class="fa-solid fa-lock"></i> Password</label
            >
            <input
              type="password"
              id="password"
              name="password"
              required
              placeholder="***********"
            />
          </div>
          <div id="loginError" class="error-message"></div>
          <button type="submit" class="btn">
            <i class="fas fa-sign-in-alt"></i> Login
          </button>
        </form>
      </div>
    </div>
    <!-- Main Dashboard -->
    <div class="dashboard hidden">
      <h1>Dang nhap thanh cong</h1>
    </div>
    <!-- Scripts -->
    <script src="./assets/js/config.js"></script>
    <script src="./assets/js/api.js"></script>
    <script src="./assets/js/auth.js"></script>
    <script src="./assets/js/main.js"></script>
  </body>
</html>
